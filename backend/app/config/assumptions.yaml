# Every number the model uses that is NOT read from a dataset lives here.
# source: "catalogue" (VAS-R1 interventions CSV), "VAS-R1 data", "standard" (published reference)
# or "team assumption" (our choice; stated openly in the UI).

# ---- scores
- key: water_ok_m
  label: Water within a short detour
  value: 100
  unit: m
  source: team assumption
  note: A fountain or oasis within 100 m (straight line) of the trail counts as reachable (matches the 100 m fountain buffers).
- key: water_bad_m
  label: Water too far
  value: 300
  unit: m
  source: team assumption
  note: At 300 m or more the water score is 1 (worst). Linear in between.
- key: solar_low_pct
  label: Sun score 0 at this percentile
  value: 5
  unit: percentile
  source: team assumption
  note: The municipal solar raster has no stated unit ("working measure"), so sun is scored relative to the whole built cycle network, not to the trails in scope. Its 5th percentile scores 0.
- key: solar_high_pct
  label: Sun score 1 at this percentile
  value: 95
  unit: percentile
  source: team assumption
  note: The 95th percentile of the solar index over the whole built network scores 1. Percentiles instead of min/max keep outliers from stretching the scale.
- key: utci_ok_c
  label: UTCI with no heat stress
  value: 26
  unit: °C
  source: standard
  note: Upper bound of the UTCI "no thermal stress" band; temperature score 0.
- key: utci_bad_c
  label: UTCI very strong heat stress
  value: 46
  unit: °C
  source: standard
  note: Upper bound of the UTCI "very strong heat stress" band; temperature score 1.
- key: weight_heat
  label: Weight of heat in the combined score
  value: 0.5
  unit: share
  source: team assumption
  note: The challenge is about heat. The UTCI model already takes the real sun exposure of each place, so sun is partly inside heat; giving sun and heat equal weight would count sun twice.
- key: weight_sun
  label: Weight of sun in the combined score
  value: 0.25
  unit: share
  source: team assumption
  note: Sun exposure on its own (also the shade at a red-light waiting box).
- key: weight_water
  label: Weight of water in the combined score
  value: 0.25
  unit: share
  source: team assumption
  note: Water access matters, but less than heat for a ~15 min trip. Weights are normalised to sum 1.
- key: weight_wait
  label: Weight of the red-light wait in the combined score (junctions only)
  value: 0.25
  unit: share
  source: team assumption
  note: At a traffic-light junction the combined score also counts how long riders wait in the sun, so a green wave (INT-05) lowers the junction's combined score and moves it down the worst list. Added to the other weights and renormalised at junctions only. In the combined burden the junction's time stays its original wait, so the green wave is not counted twice.
- key: wait_ok_s
  label: Red-light wait with wait score 0
  value: 15
  unit: s
  source: catalogue
  note: The green-wave wait (INT-05 "<15 s").
- key: wait_bad_s
  label: Red-light wait with wait score 1
  value: 65
  unit: s
  source: catalogue
  note: INT-05 "from 65 s". The VAS-R1 junction waits are 48-68 s. Linear in between.
- key: comfortable_utci_c
  label: Comfortable cycling threshold
  value: 32
  unit: °C
  source: standard
  note: Upper bound of UTCI "moderate heat stress". The comfortable-km KPI applies it on a warm summer afternoon (typical_day_percentiles), where today ~39% of the network is below it. On the hot design afternoon no street is (34.6-37.8 °C), so that KPI would read 0% today whatever was built.
- key: strong_heat_utci_c
  label: Very strong heat stress threshold
  value: 38
  unit: °C
  source: standard
  note: Lower bound of UTCI "very strong heat stress". The out-of-very-strong-heat KPI applies it on a heatwave afternoon (heatwave_day_percentile), where today ~44% of the network is above it. On the hot design afternoon every street is below it, so that KPI would read 100% today and could never improve.
- key: typical_day_percentiles
  label: Warm summer afternoon (comfort KPI)
  value: [60, 80]
  unit: percentile
  source: team assumption
  note: The July-August 2023-2025 days whose 14:00 air temperature lies between these percentiles (40 of 186 days, ~29 °C air), averaged like the hot afternoon. Comfort is judged on a warm but ordinary summer day, the day people decide whether to cycle; on the median day (~28 °C) most of the network is already comfortable, on the hot design day none is. Fixes keep their catalogue UTCI cut.
- key: heatwave_day_percentile
  label: Heatwave afternoon (very strong heat KPI)
  value: 99
  unit: percentile
  source: team assumption
  note: The hottest 1% of July-August afternoons at 14:00 (the 2 hottest of 186 days, ~34.2 °C air) - the peak heatwave a plan must withstand. With the hottest 2% (~33.8 °C) 94% of the network is already below 38 °C, so the KPI could barely move. Very strong heat stress is a heatwave risk, so it is measured on heatwave days. Fixes keep their catalogue UTCI cut.
- key: critical_utci_percentile
  label: Critical points (hottest share of the network)
  value: 90
  unit: percentile
  source: team assumption
  note: A street piece or bike station is critical when its computed UTCI today is in the hottest 10% of all pieces and stations; the 5 traffic-light junctions (waits in full sun) are always critical. Replaces the synthetic VAS-R1 "Critical" trail labels, which do not match the computed heat (e.g. TRM-12 is labelled Critical but is among the coolest).
- key: heat_reference_hour
  label: Hour of the heat model
  value: 14
  unit: h
  source: VAS-R1 data
  note: The VAS-R1 brief gives UTCI at 14:00, the hottest cycling hour of its hourly profile. The UTCI model uses the real weather at this local hour (radiation is the mean of the hour before).

# ---- heat model (UTCI computed from real inputs; junctions keep the synthetic VAS-R1 UTCI)
- key: hot_day_percentile
  label: Hot summer afternoon
  value: 90
  unit: percentile
  source: team assumption
  note: The model is evaluated for a hot afternoon, not an average one - the July-August 2023-2025 days whose air temperature at the reference hour is at or above this percentile (19 of 186 days), each weather variable averaged over those same days so they stay consistent (ERA5 reanalysis via Open-Meteo). Planners adapt for the hot days; the median day (28 °C) would hide the problem.
- key: landsat_overpass_hours
  label: Hours around the Landsat overpass
  value: [10, 11]
  unit: h
  source: standard
  note: Landsat 8/9 pass over Viladecans at ~10:30 local time. The median air temperature of these hours is subtracted from the Landsat surface temperature to get how much hotter each ground is than the air; that excess is added to the air temperature of the reference hour (conservative - the excess usually grows towards midday).
- key: sun_share_from
  label: Share of direct sun at a place
  value: sun score
  unit: share
  source: team assumption
  note: The direct-sun term of the radiation is scaled by the sun score of the real solar index (network 5th percentile = full shade, 95th = full sun). The lowest values are ~27% of the highest, about the diffuse share of annual sunshine in Barcelona, so the index reads as diffuse light plus a share of direct sun. Diffuse light and sky view are not reduced in shade.
- key: ground_albedo
  label: Ground albedo
  value: 0.15
  unit: share
  source: standard
  note: Typical of aged asphalt and concrete pavements (0.1-0.2). Sets how much sunlight the ground reflects onto a person.
- key: ground_emissivity
  label: Ground emissivity
  value: 0.95
  unit: share
  source: standard
  note: Typical of asphalt and concrete (0.93-0.96). Sets the longwave heat the ground radiates at its surface temperature.
- key: station_heat_from
  label: Heat and sun at an AMBici station
  value: nearest street segment
  unit: ""
  source: team assumption
  note: A station's UTCI is computed like a piece's, from the real solar index and Landsat surface temperature of the nearest street segment. The synthetic temperature anomaly of the two VAS-R1 stations is not added (it was relative to the synthetic trail UTCI).

# ---- ranking and burden
- key: cycling_speed_ms
  label: Cycling speed
  value: 4.2
  unit: m/s
  source: team assumption
  note: About 15 km/h, a typical urban commuting speed. Turns piece length into seconds of exposure. Each piece's time is scaled so a trail's total ride time matches its VAS-R1 length, because the matched real street can be longer or shorter than the synthetic route.
- key: station_dwell_s
  label: Time spent at a bike station
  value: 60
  unit: s
  source: team assumption
  note: Docking or undocking a bike. Junctions use their own red-light wait from the data (shortened by a green wave).
- key: station_users_per_day
  label: People using a bike station per day
  value: 150
  unit: people/day
  source: team assumption
  note: A station has 20-40 docks (catalogue INT-06 unit) used ~5 times a day. Only these people stand at the station; weighting it by every rider of its trail (up to 1,150) overstated it.
- key: off_trail_riders
  label: Riders on a street off the trails
  value: class median x spring/summer ratio
  unit: riders/day
  source: team assumption
  note: Streets off the VAS-R1 trails have no rider counts. Each takes the median synthetic summer riders of the matched trail streets of its cycle class (e.g. cycle lane on the pavement, cycle street, pedestrian zone), scaled to spring by the trails' total spring / summer riders, as trail points use spring riders. They have no summer drop, so they win back no riders in the KPIs.
- key: vas_station_match
  label: VAS-R1 stations placed on real AMBici stations
  value: ["EST-B01 → 34863", "EST-B02 → 34868"]
  unit: ""
  source: team assumption
  note: Matched by name and trail, as their synthetic coordinates are 120–650 m off. "Train Station Hub" is 02. RENFE - Parc de la Marina; "Atrium" on Tarradellas Ave is 09. Torrent Ballester - Atrium. Both keep their synthetic notes and shade.

# ---- fix effects
- key: trees_solar_cut
  label: Sun blocked by trees (INT-01)
  value: 0.5
  unit: share
  source: team assumption
  note: The catalogue gives °C but not shade; a mature tree alignment is assumed to halve the solar index.
- key: canopy_solar_cut
  label: Sun blocked by a station canopy (INT-06)
  value: 0.5
  unit: share
  source: team assumption
  note: Solar canopy over the docks.
- key: stacking_secondary_factor
  label: Extra cooling of a second fix at the same place
  value: 0.5
  unit: share
  source: team assumption
  note: The largest UTCI reduction at a place counts fully; every further one counts at 50% (e.g. cool pavement under new trees heats up less anyway). Caveat - the cool-pavement UTCI cut is the synthetic catalogue value; field studies of reflective coatings found cooler surfaces but more reflected sun on people at midday, so its real effect on riders is uncertain.
- key: green_wave_wait_s
  label: Wait after green-wave priority (INT-05)
  value: 15
  unit: s
  source: catalogue
  note: Catalogue note "cuts cyclist waiting time in the sun from 65 s to <15 s". The green wave shortens the time spent at the red light (exposure time); it does not change the temperature there, so the catalogue UTCI figure is not applied on top.
- key: linear_fix_unit_m
  label: Pricing unit of trees and cool pavement
  value: 100
  unit: m
  source: catalogue
  note: INT-01 and INT-04 are priced per 100 linear metres and are laid along the whole real street segment, priced pro rata to its length.

# ---- KPIs (riders and replaced trips)
- key: rider_drop_from
  label: What drives the summer rider drop
  value: heat dose above the comfortable threshold
  unit: ""
  source: team assumption
  note: A trail's summer drop (synthetic spring minus summer riders) is caused by its heat dose - UTCI above the comfortable threshold (32 °C) x rider-seconds on its pieces, junctions and stations. Removing the whole dose wins back the whole drop, proportionally in between. In the synthetic data the drop is linear in UTCI (r = 0.99) and reaches zero at ~28.7 °C; the computed UTCI no longer ranks the trails like the synthetic one, so the zero point is the standard comfort threshold rather than the cool VAS-R1 trails.
- key: summer_days
  label: Summer days per year
  value: 122
  unit: days
  source: team assumption
  note: June to September.
- key: trips_per_cyclist_day
  label: Trips per cyclist per day
  value: 2
  unit: trips
  source: team assumption
  note: A return journey. Turns recovered trips into new summer cyclists.
- key: avg_trip_km
  label: Average trip length
  value: 3.8
  unit: km
  source: catalogue
  note: INT-08 "replaced trip (3.8 km avg)". Recovered rider-km on the trails are divided by it to count trips once, even when a trip uses several trails.
- key: eur_per_trip
  label: Saving per replaced trip
  value: 1.15
  unit: €
  source: catalogue
  note: INT-08 "saves €1.15" per trip kept on a bike instead of a car. Its CO₂ factor (kg per trip) is read from the catalogue itself.
- key: car_trip_share
  label: Share of won-back trips that replace a car trip
  value: 0.5
  unit: share
  source: team assumption
  note: INT-08 assumes every trip kept on a bike replaces a car trip. In summer some people walk, take the bus or don't travel instead, so only this share counts for CO₂ and € saved.
- key: adapted_min_utci_drop_c
  label: Minimum cooling for a km to count as adapted
  value: 2
  unit: °C
  source: team assumption
  note: A street piece counts towards "km of adapted route" only if the plan lowers its UTCI by at least this much. Cool pavement alone (catalogue cut below 2 °C) no longer counts, so painting cheap streets can't make the cost per adapted km look good; its cost still counts in that ratio.
- key: rider_km_cap_from
  label: Distance a won-back rider rides on one trail
  value: trail length, at most one average trip (3.8 km)
  unit: ""
  source: team assumption
  note: Rider-km = won-back riders x min(trail length, average trip). Assuming every rider rode the whole trail inflated trips on long trails.
- key: fix_lifetime_yr
  label: Service life of each fix
  value: ["INT-01 → 30", "INT-02 → 10", "INT-03 → 15", "INT-04 → 7", "INT-05 → 10", "INT-06 → 20", "INT-09 → 15"]
  unit: years
  source: team assumption
  note: The catalogue has no lifetime. Trees 30 yr, shade sail 10, oasis 15, cool pavement coating 7, green-wave controllers 10, solar canopy 20, drinking fountain 15. Used to spread the one-off investment over the years, so the cost per new summer cyclist compares yearly cost with yearly benefit.
